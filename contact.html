<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Contact us for your enquiries, feedback, or support. Easily get in touch via our online form." />
  <title>Contact Us | Your Website Name</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      max-width: 600px;
    }
    h1 {
      color: #333;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }
    input, textarea {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      box-sizing: border-box;
      font-size: 1em;
    }
    button {
      margin-top: 20px;
      padding: 10px 15px;
      background-color: teal;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 1em;
    }
    button:hover {
      background-color: #006666;
    }
    .error {
      color: red;
      font-size: 0.9em;
      margin-top: 3px;
    }
    #success-message {
      color: green;
      font-weight: bold;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Contact Us</h1>
  <form id="contactForm" novalidate>
    <label for="name">Name (required):</label>
    <input type="text" id="name" name="name" required />
    <div id="name-error" class="error"></div>

    <label for="email">Email (required):</label>
    <input type="email" id="email" name="email" required />
    <div id="email-error" class="error"></div>

    <label for="phone">Phone (optional):</label>
    <input type="tel" id="phone" name="phone" pattern="^\+?[0-9\s\-]{7,15}$" placeholder="+27 123 456 7890" />
    <div id="phone-error" class="error"></div>

    <label for="message">Message (required):</label>
    <textarea id="message" name="message" rows="5" required></textarea>
    <div id="message-error" class="error"></div>

    <button type="submit">Send</button>
  </form>

  <div id="success-message"></div>

  <script>
    const form = document.getElementById('contactForm');

    form.addEventListener('submit', function(event) {
      event.preventDefault();

      // Clear previous errors and success message
      document.querySelectorAll('.error').forEach(el => el.textContent = '');
      document.getElementById('success-message').textContent = '';

      let valid = true;

      // Name validation
      const name = form.name.value.trim();
      if (name === '') {
        document.getElementById('name-error').textContent = 'Name is required.';
        valid = false;
      }

      // Email validation
      const email = form.email.value.trim();
      if (email === '') {
        document.getElementById('email-error').textContent = 'Email is required.';
        valid = false;
      } else if (!/\S+@\S+\.\S+/.test(email)) {
        document.getElementById('email-error').textContent = 'Email format is invalid.';
        valid = false;
      }

      // Phone validation (optional)
      const phone = form.phone.value.trim();
      if (phone && !/^\+?[0-9\s\-]{7,15}$/.test(phone)) {
        document.getElementById('phone-error').textContent = 'Phone format is invalid.';
        valid = false;
      }

      // Message validation
      const message = form.message.value.trim();
      if (message === '') {
        document.getElementById('message-error').textContent = 'Message is required.';
        valid = false;
      }

      if (valid) {
        // Here you could add AJAX to send form data to a server
        // For now, just show success message
        document.getElementById('success-message').textContent = 'Thank you for contacting us! We will get back to you shortly.';
        form.reset();
      }
    });
  </script>
</body>
</html>
